# Native controller and speaker images are published for amd64 and arm64:
# https://github.com/metallb/metallb/releases/tag/v0.16.2
type: charm
bases:
  - build-on:
    - name: "ubuntu"
      channel: "22.04"
      architectures: ["amd64"]
    run-on:
    - name: "ubuntu"
      channel: "22.04"
      architectures:
        - amd64
        - arm64
parts:
  charm:
    prime:
      - upstream/**